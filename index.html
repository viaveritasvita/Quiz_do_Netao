<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Netão — Escolha sua aventura</title>
<style>
  :root{
    --ink:#1a2238; --paper:#f3ead6; --paper2:#ece0c4;
    --sea:#2c6e8f; --sea-dk:#1d4f68; --brass:#c9962a; --brass-dk:#a87a18;
    --coral:#c44a3d; --green:#3f7d54; --line:#cbb98f;
    --space:#3a2a6b; --space-dk:#241a47;
    --shadow:rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--paper);
    background:var(--ink);min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px;
    background-image:radial-gradient(circle at 80% 8%, #2b3a6b 0, var(--ink) 60%),radial-gradient(circle at 12% 90%, #3a2a6b 0, transparent 55%);
  }
  .wrap{width:100%;max-width:440px}
  .head{text-align:center;margin-bottom:22px}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#b9c6e6;font-weight:bold;margin-bottom:8px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1;letter-spacing:-.5px}
  h1 .big{color:var(--coral);text-shadow:1px 1px 0 var(--brass)}
  .sub{font-size:14px;color:#c7d2ec;font-style:italic;margin-top:8px}
  .books{display:flex;flex-direction:column;gap:16px}
  .book{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:20px;padding:20px;
    box-shadow:0 12px 30px var(--shadow), inset 0 0 0 2px var(--paper2);position:relative;overflow:hidden;
    border-left:8px solid var(--sea);transition:transform .15s, box-shadow .15s}
  .book:active{transform:scale(.99)}
  .book:hover{transform:translateY(-3px)}
  .book.space{border-left-color:var(--space)}
  .book .emoji{font-size:46px;line-height:1;float:right;margin-left:12px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
  .book .tag{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;
    background:var(--sea);color:#fff;border-radius:99px;padding:3px 10px;margin-bottom:8px}
  .book.space .tag{background:var(--space)}
  .book .new{background:var(--coral)}
  .book h2{font-family:Georgia,serif;font-size:23px;line-height:1.1;color:var(--ink);margin-bottom:4px}
  .book .author{font-size:12.5px;color:var(--sea-dk)}
  .book .play{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-weight:bold;font-size:15px;color:#fff;
    background:var(--coral);border-radius:12px;padding:11px 18px;box-shadow:0 4px 0 #8f3025}
  .book.space .play{background:var(--space);box-shadow:0 4px 0 var(--space-dk)}
  .foot{text-align:center;font-size:11px;color:#9fb0d6;opacity:.85;margin-top:22px;line-height:1.6}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="eyebrow">Diário de Bordo · Júlio Verne</div>
      <h1>Quiz do <span class="big">Netão</span></h1>
      <div class="sub">Escolha sua aventura, explorador!</div>
    </div>

    <div class="books">
      <a class="book" href="volta80.html">
        <span class="emoji">🌍</span>
        <span class="tag">Aventura</span>
        <h2>A Volta ao Mundo em 80 Dias</h2>
        <div class="author">Júlio Verne</div>
        <span class="play">Jogar ⛵</span>
      </a>

      <a class="book space" href="terralua.html">
        <span class="emoji">🚀</span>
        <span class="tag new">Novo!</span>
        <h2>Da Terra à Lua</h2>
        <div class="author">Júlio Verne</div>
        <span class="play">Jogar 🌙</span>
      </a>
    </div>

    <div class="foot">Cada aventura tem seu próprio placar.<br>Feito com carinho · funciona no celular</div>
  </div>
</body>
</html>
